<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>SuperSam</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="gameContainer">
  <canvas id="gameCanvas" width="800" height="480"></canvas>

  <div id="ui">
    <div class="hud" id="scoreDisplay">Score: 0</div>
    <div class="hud" id="levelDisplay">Level 1</div>
    <div style="display:flex;align-items:center;">
      <div id="livesBar"></div>
      <span id="forkHud" title="MasterFork ready — press F">🍴</span>
    </div>
  </div>

  <!-- Overlay: start menu / game over / highscores rendered by JS -->
  <div id="overlay"></div>

  <!-- Virtual gamepad (shown on touch devices) -->
  <div id="touch-controls">
    <div class="tc-side tc-left">
      <button class="tc-btn tc-dpad-left"  id="tc-left">◀</button>
      <button class="tc-btn tc-dpad-right" id="tc-right">▶</button>
    </div>
    <div class="tc-side tc-right">
      <button class="tc-btn tc-fire" id="tc-fire">⚡</button>
      <button class="tc-btn tc-jump" id="tc-jump">▲</button>
    </div>
  </div>
</div>

<!-- Portrait orientation nudge (pure CSS, no JS) -->
<div id="rotate-hint">
  <div style="font-size:56px;">📱➡️</div>
  <div>Rotate to landscape<br>for the best experience</div>
</div>

<script src="js/audio.js"></script>
<script src="js/levels.js"></script>
<script src="js/draw.js"></script>
<script src="js/game.js"></script>
</body>
</html>
